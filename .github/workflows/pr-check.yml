name: PR Check

# Los nombres `quality` y `e2e` son los que declara `git_strategy.policy.required_checks`
# en `.agents/project.yaml`. Ningún trabajo lee secretos ni necesita Supabase.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `.claude/skills` is a generated, gitignored alias: a fresh checkout never
      # has it and `agents:compat:check` fails without it. Fail if regenerating
      # touched anything tracked.
      - name: Generate harness surfaces
        run: |
          bun run agents:compat
          if [ -n "$(git status --porcelain)" ]; then
            echo "agents:compat changed committed files; run it locally and commit the result:"
            git status --porcelain
            exit 1
          fi

      - name: Repo checks
        run: bun run repo:check

      - name: Tests
        run: bun run test

      - name: Build without any secret
        run: bun run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install the browser
        run: bunx playwright install --with-deps chromium

      - name: End-to-end tests
        run: bun run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-e2e
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  safari:
    name: safari
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install the browser
        run: bunx playwright install --with-deps webkit

      - name: End-to-end tests in WebKit
        run: bun run test:e2e:safari

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-safari
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  visual:
    name: visual
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    # Las capturas de referencia se generan en esta misma imagen (ver README).
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # La imagen no trae Bun.
      - name: Install Bun
        run: npm i -g "bun@$(cat .bun-version)"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Visual comparison
        run: bun run test:visual

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-visual
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
