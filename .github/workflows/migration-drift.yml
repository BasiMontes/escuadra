name: Migration drift

# Compares `supabase/migrations/` with what the production project says it applied. It runs on the promotion source
# branch too, so a migration nobody applied shows before the code that needs it reaches production.

on:
  schedule:
    - cron: '23 6 * * 1'
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: vars.MIGRATION_DRIFT_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: '2.109.1'

      # Switched on but half configured must fail here, with the missing names.
      - name: Check the secrets are set
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            [ -n "${!name}" ] || { echo "::error::secret ${name} is not set"; missing=1; }
          done
          [ "$missing" = 0 ]

      - name: Link to the production project
        run: |
          ref="$(bun scripts/ops-config.ts production db_project_ref)"
          supabase link --project-ref "$ref"

      - name: Compare the migrations
        run: bun scripts/check-migration-drift.ts

      # A red scheduled run notifies nobody, so a failure opens (or comments on) one issue.
      - name: Open or update the issue
        if: failure() && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: 'Migrations differ from the production database'
        run: |
          existing="$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "Run: $RUN_URL. The log of the run lists the differences."
          fi
