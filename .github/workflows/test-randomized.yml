name: Randomized unit tests

# The default order hides tests that depend on the one before them. A random order in the PR check would make the
# check itself flaky, so it runs here every night, with the seed printed to replay a failure.

on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
    inputs:
      seed:
        description: 'Seed to replay (empty: pick one)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  randomized:
    name: bun test --randomize
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run the app tests in a random order
        env:
          REPLAY_SEED: ${{ inputs.seed }}
        run: |
          SEED="${REPLAY_SEED:-$(date +%s)}"
          echo "Seed: \`${SEED}\`. Replay with \`bun run test:app:random --seed=${SEED}\`." | tee -a "$GITHUB_STEP_SUMMARY"
          bun run test:app:random --seed="${SEED}"
