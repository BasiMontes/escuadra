name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, tipos y tests unitarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  e2e:
    name: Flujos y accesibilidad (Playwright)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-e2e
          path: playwright-report
          retention-days: 7

  visual:
    name: Comparación visual
    runs-on: ubuntu-latest
    needs: check
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - uses: actions/checkout@v4
      # Solo se compara cuando ya hay capturas de referencia en el repo
      - id: refs
        run: |
          if ls e2e/__screenshots__/linux/*/*.png >/dev/null 2>&1; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.refs.outputs.present == 'false'
        run: echo "::notice::Sin capturas de referencia todavía; se omite la comparación visual."
      - if: steps.refs.outputs.present == 'true'
        run: npm ci
      - if: steps.refs.outputs.present == 'true'
        run: npm run test:visual
        env:
          HOME: /root
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-visual
          path: playwright-report
          retention-days: 7
