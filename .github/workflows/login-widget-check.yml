name: Login widget check

# Loads production `/login` in a browser and fails unless the Turnstile widget renders: when it does not, nobody can
# sign in and no other check notices. Turn it on only if the project uses Turnstile.

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  widget:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: vars.LOGIN_WIDGET_CHECK_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install the browser
        run: bunx playwright install --with-deps chromium

      - name: Check the widget renders
        run: |
          url="$(bun scripts/ops-config.ts production web_url)"
          bun scripts/check-login-widget.ts "$url"

      # A red scheduled run notifies nobody, so a failure opens (or comments on) one issue.
      - name: Open or update the issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: 'The Turnstile widget does not render on /login'
        run: |
          existing="$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "Run: $RUN_URL. Check the site key in Vercel, the Content-Security-Policy and the widget in Cloudflare."
          fi
